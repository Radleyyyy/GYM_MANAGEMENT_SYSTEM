<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Gym System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="sidebar">
    <h2>GymPro</h2>
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('members.list_members') }}">Members</a>
          <a href="{{ url_for('members.register') }}">Register Member</a>
                <a href="{{ url_for('plans.list_plans') }}">Plans</a>
              <a href="#">Memberships</a>
                <a href="#">Attendance</a>
                  <a href="#">Payments</a>
                    <a href="#">Expiration</a>
                      <a href="#">Reports</a>
                        </nav>
                          <main class="content">
                          {% with messages = get_flashed_messages(with_categories=true) %}
                          {% for category, message in messages %}
                          <div class="flash flash-{{ category }}">{{ message }}</div>
                      {% endfor %}
                      {% endwith %}
                        {% block content %}{% endblock %}
  </main>
</body>
</html>
