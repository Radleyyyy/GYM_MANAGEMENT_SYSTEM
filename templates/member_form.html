{% extends "base.html" %}
{% block title %}{{ 'Edit Member' if editing else 'Register Member' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit Member' if editing else 'Register Member' }}</h1>
{% if editing %}<p class="muted">Member Number: <strong>{{ member_number }}</strong></p>{% endif %}
<form method="post" class="form-card">
  <div class="grid">
    <label>First Name *
      <input type="text" name="first_name" value="{{ form.first_name }}" required>
    </label>
    <label>Last Name *
      <input type="text" name="last_name" value="{{ form.last_name }}" required>
    </label>
    <label>Gender *
      <select name="gender" required>
        <option value="">-- Select --</option>
        {% for g in ["Male", "Female", "Other"] %}
        <option value="{{ g }}" {% if form.gender == g %}selected{% endif %}>{{ g }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Date of Birth *
      <input type="date" name="date_of_birth" value="{{ form.date_of_birth }}" required>
    </label>
    <label>Contact Number *
      <input type="text" name="contact_number" value="{{ form.contact_number }}" required>
    </label>
    <label>Email *
      <input type="email" name="email" value="{{ form.email }}" required>
    </label>
        <label>Course *
      <select name="course_id" required>
        <option value="">-- Select a course --</option>
        {% for c in courses %}
        <option value="{{ c.course_id }}" {% if form.course_id|string == c.course_id|string %}selected{% endif %}>{{ c.course_name }}</option>
        {% endfor %}
      </select>
      {% if not courses %}<span class="muted">No courses yet. <a href="{{ url_for('courses.add') }}">Add a course</a> first.</span>{% endif %}
    </label>
    <label class="full">Address
      <input type="text" name="address" value="{{ form.address }}">
    </label>
    <label class="full">Emergency Contact
      <input type="text" name="emergency_contact" value="{{ form.emergency_contact }}">
    </label>
  </div>
  <div class="actions">
    <button type="submit" class="btn">{{ 'Save Changes' if editing else 'Register Member' }}</button>
    <a href="{{ url_for('members.list_members') }}" class="btn btn-light">Cancel</a>
  </div>
</form>
{% endblock %}
